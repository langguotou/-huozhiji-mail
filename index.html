<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>霍志鸡邮箱</title>
<script>
// 微信内置浏览器(X5)不支持 background-attachment:fixed 且禁止视频自动播放
// 检测到微信时：改用静态封面图铺满背景，并隐藏视频，避免黑屏/背景不显示
(function () {
  if (navigator.userAgent.toLowerCase().indexOf('micromessenger') === -1) return;
  document.documentElement.classList.add('is-wechat');
  document.documentElement.style.background =
    '#12121f url("assets/poster.jpg") center center / cover no-repeat scroll';
  document.addEventListener('DOMContentLoaded', function () {
    var v = document.querySelector('.bg-video');
    if (v) v.style.display = 'none';
  });
})();
</script>
<link rel="stylesheet" href="css/style.css">
<style>
/* 悬浮音乐按钮 */
.music-btn {
  position: fixed; right: 14px; bottom: 20px; z-index: 150;
  width: 52px; height: 52px; border-radius: 50%; border: 1px solid rgba(255,255,255,.6);
  background: linear-gradient(135deg, #ff4d6d, #ffb703, #06d6a0, #4cc9f0, #b5179e);
  background-size: 300% 300%; animation: rainbowShift 6s ease infinite, musicPulse 1.6s ease-in-out infinite;
  box-shadow: 0 0 18px rgba(255,90,180,.7); color: #fff; font-size: 24px;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
}
.music-btn .note { display: inline-block; line-height: 1; }
.music-btn.playing .note { animation: noteSpin 3s linear infinite; }
@keyframes noteSpin { from { transform: rotate(0); } to { transform: rotate(360deg); } }
@keyframes musicPulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.08); } }
@media (min-width: 768px) { .music-btn { right: 28px; bottom: 28px; width: 58px; height: 58px; font-size: 27px; } }
@media (prefers-reduced-motion: reduce) { .music-btn, .music-btn .note { animation: none !important; } }
</style>
</head>
<body>

<!-- 动态背景 -->
<video class="bg-video" autoplay muted loop playsinline preload="auto" poster="assets/poster.jpg" aria-hidden="true">
  <source src="assets/background.mp4" type="video/mp4">
</video>
<div class="bg-overlay" aria-hidden="true"></div>
<div class="sparkles" aria-hidden="true"></div>

<!-- 背景音乐 -->
<audio id="bgMusic" src="assets/music.mp3" loop autoplay preload="auto"></audio>
<button class="music-btn" id="musicBtn" title="播放音乐" aria-label="播放背景音乐"><span class="note">🎵</span></button>

<!-- 顶栏 -->
<div class="header">
  <button class="menu-btn" id="menuBtn" title="邮箱池">
    <span></span><span></span><span></span>
  </button>
  <div class="header-title"><span class="title-text">霍志鸡邮箱</span><span class="title-emoji">👿👾👽</span></div>
  <button class="ad-btn" id="adBtn" title="公告">📢</button>
</div>

<!-- 侧边栏（邮箱池） -->
<div class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <span>我的邮箱池</span>
    <button class="sidebar-close" id="sidebarClose">✕</button>
  </div>
  <div class="sidebar-actions">
    <button class="new-mail-btn" id="newMailBtn">➕ 新建邮箱</button>
  </div>
  <div class="mailbox-list" id="mailboxList">
    <!-- 动态生成邮箱列表 -->
  </div>
  <div class="sidebar-footer">
    <button class="fullscreen-btn" id="fullscreenBtn">🖥️ 退出全屏</button>
  </div>
</div>
<div class="sidebar-overlay" id="sidebarOverlay"></div>

<!-- 邮箱信息区 -->
<div class="email-section">
  <div class="email-label">自定义邮箱前缀（可选）</div>
  <div class="prefix-input-box">
    <input type="text" id="prefixInput" placeholder="任意输入，如 cnm..." maxlength="20">
    <button class="generate-btn" id="generateBtn">✨ 生成邮箱</button>
  </div>
  <div class="email-box" id="emailBox">
    <span class="email-text" id="emailText">等待生成邮箱...</span>
    <button class="copy-btn" id="copyBtn" disabled>复制</button>
  </div>
  <div class="email-actions">
    <button class="save-btn" id="saveBtn" disabled>💾 保存到邮箱池</button>
  </div>
  <div class="email-hint">左上角 ☰ 查看邮箱池 · 输入前缀点击 ✨ 生成 · 每 5 秒自动接收新邮件</div>
  <div class="error-msg" id="errorMsg"></div>
</div>

<!-- 邮件列表 -->
<div class="mail-section">
  <div class="mail-header">
    <span class="mail-title">收件箱</span>
    <button class="refresh-btn" id="refreshBtn">↻ 刷新</button>
  </div>
  <div class="mail-list" id="mailList">
    <div class="empty-state" id="emptyState">
      <div class="empty-icon">📭</div>
      <div>暂无邮件</div>
      <div class="empty-sub">生成邮箱后等待接收...</div>
    </div>
  </div>
</div>

<!-- 邮件详情弹窗 -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-subject" id="modalSubject">邮件主题</span>
      <button class="modal-close" id="modalClose">✕</button>
    </div>
    <div class="modal-meta">
      <span>发件人：<b id="modalFrom"></b></span>
      <span>时间：<b id="modalDate"></b></span>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<!-- 发件弹窗 -->
<div class="modal-overlay" id="composeOverlay">
  <div class="modal compose-modal">
    <div class="modal-header">
      <span class="modal-subject">公告</span>
      <button class="modal-close" id="composeClose">✕</button>
    </div>
    <div class="compose-form">
      <div class="form-note" style="font-size:16px; color:#333; padding:20px;">
        本软件为江门市新会陈经纶中学霍志钧同学制作
      </div>
    </div>
  </div>
</div>

<script src="js/app.js"></script>
<script>
// 背景音乐控制：打开即自动播放，并在多个时机反复尝试；按钮可暂停/恢复
(function () {
  var audio = document.getElementById('bgMusic');
  var btn = document.getElementById('musicBtn');
  var note = btn.querySelector('.note');
  var wantPlay = true; // 默认自动播放

  function render() {
    var playing = !audio.paused;
    btn.classList.toggle('playing', playing);
    note.textContent = playing ? '🎶' : '🎵';
    btn.title = playing ? '暂停音乐' : '播放音乐';
  }
  function tryPlay() {
    if (!wantPlay) return;
    var p = audio.play();
    if (p && p.catch) p.catch(function () {});
  }

  btn.addEventListener('click', function (e) {
    e.stopPropagation();
    if (audio.paused) { wantPlay = true; tryPlay(); }
    else { wantPlay = false; audio.pause(); }
    render();
  });
  audio.addEventListener('play', render);
  audio.addEventListener('pause', render);

  // 页面加载即尝试自动播放，并在前几秒密集重试（应对部分浏览器延迟放行）
  audio.addEventListener('canplay', tryPlay);
  window.addEventListener('load', tryPlay);
  tryPlay();
  var retries = 0;
  var retryTimer = setInterval(function () {
    if (!audio.paused || !wantPlay || ++retries > 20) { clearInterval(retryTimer); return; }
    tryPlay();
  }, 300);

  // 微信内置浏览器需等 WeixinJSBridge 就绪后播放
  function wxReady() { tryPlay(); }
  if (window.WeixinJSBridge) {
    WeixinJSBridge.invoke('getNetworkType', {}, wxReady);
  } else {
    document.addEventListener('WeixinJSBridgeReady', wxReady, false);
  }

  // 页面从后台切回时，若仍希望播放则继续（满足各浏览器自动播放策略）
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) tryPlay();
  });

  // 兜底：若自动播放被拦截，用户任意点击/触摸后仍会开始
  function onGesture() {
    if (wantPlay && audio.paused) tryPlay();
    document.removeEventListener('click', onGesture);
    document.removeEventListener('touchstart', onGesture);
  }
  document.addEventListener('click', onGesture);
  document.addEventListener('touchstart', onGesture);

  render();
})();
</script>
</body>
</html>
